# Local development for every team member:  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cit_scheduler
      MYSQL_USER: cit
      MYSQL_PASSWORD: citdev
      MYSQL_ROOT_PASSWORD: rootdev
    ports: ["3307:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: cit_scheduler
      DB_USER: cit
      DB_PASSWORD: citdev
    volumes:
      - ./exports:/var/www/app/exports
volumes:
  dbdata:
