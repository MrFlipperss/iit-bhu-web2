<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · CIT Scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>

<body>
  <div class="login">
    <canvas id="hero-waves-canvas" class="hero-waves"></canvas>
    <div class="login-card">
      <div class="login-box">
        <div style="margin-bottom:24px">
          <a href="index.html" class="brand-pill">
            <div class="brand-mark" style="width:18px;height:18px;padding:3px;margin-right:2px">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <span class="brand-pill-title">CIT Scheduler</span>
          </a>
        </div>
        <form id="f" autocomplete="on">
          <h1
            style="margin-bottom:8px;font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--c-deep-charcoal)">
            Crunch Week Scheduler</h1>
          <p class="sub" style="margin-bottom:24px;color:var(--c-secondary-text);font-size:13.5px;line-height:1.45">Classes, midsems and Spectra events
            in one plan, with every decision explained.</p>
          <div class="field">
            <label for="u">Username</label>
            <input type="text" id="u" autocomplete="username" placeholder="e.g. dean@cit.demo" required>
          </div>
          <div class="field">
            <label for="p">Password</label>
            <input type="password" id="p" autocomplete="current-password" placeholder="••••••••" required>
          </div>
          <div id="err"></div>
          <button class="btn primary" style="width:100%;justify-content:center;margin-top:12px;height:42px;font-size:14px;font-weight:600" id="go">Log
            in</button>
          <h3 style="margin-top:26px;color:var(--c-secondary-text);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em">Demo accounts</h3>
          <div class="demo-list" id="demo">
            <button type="button" data-u="dean@cit.demo">Dean of Academics <span>Admin</span></button>
            <button type="button" data-u="spectra@cit.demo">Spectra Core Team <span>Fest Organizer</span></button>
            <button type="button" data-u="coord.ece@cit.demo">ECE Coordinator <span>Dept coordinator</span></button>
            <button type="button" data-u="f12@cit.demo">Dr. Amit Behera, F12 <span>Faculty</span></button>
            <button type="button" data-u="dramatics@cit.demo">Dramatics Society <span>Club</span></button>
          </div>
          <p class="muted" style="font-size:12px;margin-top:14px;text-align:center;color:var(--c-secondary-text)">The demo password is
            prefilled on click.</p>
        </form>
      </div>
    </div>
  </div>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/hero-waves.js"></script>
  <script>
    document.querySelectorAll("#demo button").forEach(b => b.onclick = () => {
      document.getElementById("u").value = b.dataset.u;
      document.getElementById("p").value = "Kian@2407";
      document.getElementById("p").focus();
    });
    document.getElementById("f").onsubmit = async e => {
      e.preventDefault();
      const btn = document.getElementById("go");
      document.getElementById("err").innerHTML = "";
      try {
        await CIT.busy(btn, "Logging in", () => CIT.api("auth/login.php", { username: document.getElementById("u").value.trim(), password: document.getElementById("p").value }));
        const next = new URLSearchParams(location.search).get("next");
        location.replace(next && next.startsWith("/") && !next.startsWith("//") ? next : "dashboard.html");
      } catch (err) {
        document.getElementById("err").innerHTML = CIT.errorHtml(err);
      }
    };
    if (CIT.getCurrentUser()) {
      location.replace("dashboard.html");
    }
  </script>
</body>

</html>
